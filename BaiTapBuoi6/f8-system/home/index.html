<!doctype html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>HOME PAGE</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/theme.css">
</head>
<body>
<h1 class="title" id="main">HOME PAGE</h1>
<h2 class="title">Gioi thieu he thong</h2>
<h3 class="section">Cac khoa hoc noi bat</h3>
<p>HTML</p>
<p>CSS</p>
<p>Javascript</p>
<p>Python</p>
</body>
</html>
<!--Trả lời câu hỏi-->
<!--
- h1 và h2 đều dùng class title nhưng màu khác nhau.
- h1 có thêm id #main nên sẽ ưu tiên lấy style của id (#main) vì id có độ ưu tiên cao hơn class.
- h2 chỉ có class .title nên sẽ bị override bởi .title của theme.css vì theme.css được link sau base.css
-->
