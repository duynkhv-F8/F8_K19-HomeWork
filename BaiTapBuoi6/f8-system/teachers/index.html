<!doctype html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>TEACHERS PAGE</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/theme.css">
    <style>
        h3 {
            color: brown;
        }
    </style>
</head>
<body>
<h1>TEACHERS PAGE</h1>
<h2 class="title" id="special" style="color: burlywood">Danh sach giang vien</h2>
<!--
them inline style cho phan tu h2 vi trong bai tap co yeu cau 4, chi co h1 o file dashboard va h2 o file oders thoa man
du cac loai CSS 1 luc
-->

<!--
  Phan tu nay h2 nay co: tag(h1) + class(.title) + id(#special) + inline style
  Selector thang: inline style vi inline style co do uu tien cao nhat
  Mau hien thi: burlywood
-->
<h3 class="section">Giang vien HTML</h3>
<h3 class="section">Giang vien CSS</h3>
<h3 class="section">Giang vien Javascript</h3>
<h3 class="section">Giang vien React</h3>
</body>
</html>
<!--Sự khác biệt so với base.css-->
<!--màu của h3 trong internal là màu nâu. Trong base.css h3 có màu violet nhưng do h3 có class .section nên màu thực tế
sẽ là pink. Tuy nhiên internal CSS có độ ưu tiên cao hơn external CSS nên màu h3 bị override thành brown.-->
